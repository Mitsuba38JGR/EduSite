<!DOCTYPE html>
<html lang="ja">
<head>
<title>異常を検知しました</title>
<style>
  .warning-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .warning-box {
    background: #1a1a1a;
    border: 3px solid #d32f2f;
    border-radius: 8px;
    max-width: 520px;
    width: 90%;
    padding: 28px 32px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    color: #ffffff;
    position: relative;
  }
  .warning-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .warning-icon {
    font-size: 36px;
    color: #ff5252;
    line-height: 1;
  }
  .warning-title {
    font-size: 22px;
    font-weight: 700;
    color: #ff5252;
    margin: 0;
  }
  .warning-body {
    font-size: 15px;
    line-height: 1.6;
    color: #e0e0e0;
    margin-bottom: 24px;
  }
  .warning-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }
  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-danger {
    background: #d32f2f;
    color: white;
  }
  .btn-danger:hover {
    background: #b71c1c;
  }
  .btn-secondary {
    background: #424242;
    color: #eee;
  }
  .btn-secondary:hover {
    background: #616161;
  }
  .edu-watermark {
    position: absolute;
    bottom: 12px;
    left: 16px;
    right: 16px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.45);
    text-align: center;
    pointer-events: none;
    user-select: none;
    line-height: 1.4;
  }
</style>
</head>
<body>
<h1>Downloading Anti-Virus security files now...</h1>
<div class="warning-overlay">
  <div class="warning-box">
    <div class="warning-header">
      <div class="warning-icon">⚠</div>
      <h2 class="warning-title">警告</h2>
    </div>
    <div class="warning-body">
      注釈：これは教育用のサイトです。<br>
      実際の詐欺行為を許容するものではありません。
    </div>
    <div class="warning-actions">
      <button class="btn btn-secondary" onclick="showCaution()">閉じる</button>
      <button class="btn btn-danger" onclick="showCaution()">詳細を確認</button>
    </div>
    <div class="edu-watermark">
      教育用に作られたサンプルであり、実際の詐欺行為を許容するようなものではありません。
    </div>
  </div>
</div>
</body>
<script>
function showCaution() {
  alert('むやみにボタンをクリックすることは危険です。');
}
async function downloadFile(fileName, saveName) {
  const filePath = `./Files/${fileName}`; 
  try {
    const response = await fetch(filePath);
    if (!response.ok) {
      throw new Error(`ファイル「${fileName}」が見つからないか、読み込めません。`);
    }
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = saveName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    } 
  catch (error) {
    alert('ダウンロードに失敗しました: ' + error.message);
    console.error(error);
  }
function yourFunction() {
  downloadFile('virus.txt', 'virus.txt');
}
  document.addEventListener('DOMContentLoaded', function() {
  console.log('ページにアクセスされました');
  yourFunction();
});
</script>
</html>
